[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsgen-reaxff"
dynamic = ["version"]
description = "Training-set generation and adaptive parameterization for ReaxFF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "ase>=3.22",
  "dscribe>=2.1,<3",
  "numpy>=1.23",
  "pandas>=1.5",
  "pydantic>=2.6,<3",
  "PyYAML>=6",
  "scikit-learn>=1.3",
  "scipy>=1.9",
  "threadpoolctl>=3.1",
  "typer>=0.12,<1",
]

[project.scripts]
tsgen = "tsgen.cli:app"

[project.urls]
Repository = "https://github.com/horincham/TSGen"
Issues = "https://github.com/horincham/TSGen/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.dynamic]
version = {attr = "tsgen.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
